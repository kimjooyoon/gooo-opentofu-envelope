name: Gooo OpenTofu Generated Service Project

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WORK_DIR: /tmp/gooo-project-envelope
      PUBLISH_DIR: /tmp/gooo-project-envelope-publish
      EVIDENCE_DIR: /tmp/gooo-project-envelope-evidence

    steps:
      - name: Checkout submitted revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Pin Go 1.27 toolchain for evidence only
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false

      - name: Acquire immutable Gooo, OpenTofu, and specification inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR" "$PUBLISH_DIR" "$EVIDENCE_DIR"
          mkdir -p "$WORK_DIR/gooo/bin" "$WORK_DIR/tofu/bin" "$PUBLISH_DIR" "$EVIDENCE_DIR"
          lock=contracts/release-lock-v1.json
          jq -e '
            .schema=="gooo/opentofu-envelope/release-lock/v1" and
            .gooo.release_id==378565653 and
            .authority.repository_writes==0 and
            .authority.local_test_executions==0 and
            .authority.local_build_executions==0 and
            .authority.local_formatter_executions==0 and
            .authority.opentofu_init_executions==0 and
            .authority.opentofu_plan_executions==0 and
            .authority.opentofu_show_executions==0 and
            .authority.opentofu_validate_executions==1 and
            .authority.opentofu_apply_executions==0 and
            .authority.opentofu_destroy_executions==0 and
            .authority.opentofu_import_executions==0 and
            .authority.opentofu_state_mutations==0 and
            .authority.opentofu_test_executions==0 and
            .authority.opentofu_provider_accesses==0 and
            .authority.opentofu_cloud_accesses==0 and
            .authority.opentofu_runtime_network_access_claimed==false and
            .authority.opentofu_runtime_network_access_observed==false and
            .policy.default_profile=="READ_ONLY" and
            .policy.authorized_profile=="AUTHORIZED_ACCEPTANCE" and
            .cache_contract.installation_binary_cache_state=="DISABLED" and
            .cache_contract.go_build_cache_state=="DISABLED" and
            .cache_contract.prior_test_evidence_reuse_state=="NOT_REUSED" and
            .cache_contract.runner_persistence=="EPHEMERAL"
          ' "$lock" >/dev/null

          verify_release() {
            local repository=$1 tag=$2 release_id=$3 target=$4 prerelease=$5 output=$6
            gh api "repos/$repository/releases/tags/$tag" > "$output"
            jq -e --arg tag "$tag" --argjson id "$release_id" --argjson pre "$prerelease" \
              '.tag_name==$tag and .id==$id and .prerelease==$pre' "$output" >/dev/null
            resolved=$(git ls-remote "https://github.com/$repository.git" "refs/tags/$tag^{}" | awk 'NR==1{print $1}')
            test "$resolved" = "$target"
          }

          download_asset() {
            local repository=$1 release_json=$2 asset_id=$3 asset_name=$4 expected_size=$5 expected_sha=$6 output=$7
            jq -e --argjson id "$asset_id" --arg name "$asset_name" --argjson size "$expected_size" --arg digest "sha256:$expected_sha" \
              '.assets[]|select(.id==$id)|.name==$name and .size==$size and .digest==$digest' "$release_json" >/dev/null
            gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$output"
            test "$(wc -c < "$output" | tr -d ' ')" = "$expected_size"
            test "$(sha256sum "$output" | awk '{print $1}')" = "$expected_sha"
          }

          gooo_repo=$(jq -r '.gooo.repository' "$lock")
          gooo_tag=$(jq -r '.gooo.tag' "$lock")
          verify_release "$gooo_repo" "$gooo_tag" "$(jq -r '.gooo.release_id' "$lock")" "$(jq -r '.gooo.target_commit_sha' "$lock")" true "$WORK_DIR/gooo-release.json"
          download_asset "$gooo_repo" "$WORK_DIR/gooo-release.json" "$(jq -r '.gooo.asset.id' "$lock")" "$(jq -r '.gooo.asset.name' "$lock")" "$(jq -r '.gooo.asset.size' "$lock")" "$(jq -r '.gooo.asset.sha256' "$lock")" "$WORK_DIR/gooo/gooo-linux-amd64.tar.gz"
          download_asset "$gooo_repo" "$WORK_DIR/gooo-release.json" "$(jq -r '.gooo.checksums.id' "$lock")" "$(jq -r '.gooo.checksums.name' "$lock")" "$(jq -r '.gooo.checksums.size' "$lock")" "$(jq -r '.gooo.checksums.sha256' "$lock")" "$WORK_DIR/gooo/SHA256SUMS"
          (cd "$WORK_DIR/gooo" && sha256sum -c SHA256SUMS --ignore-missing)
          tar -xzf "$WORK_DIR/gooo/gooo-linux-amd64.tar.gz" -C "$WORK_DIR/gooo/bin"
          gooo=$(find "$WORK_DIR/gooo/bin" -type f -name gooo -print -quit)
          test -n "$gooo"
          chmod +x "$gooo"
          printf '%s\n' "$gooo" > "$WORK_DIR/gooo-path"

          tofu_repo=$(jq -r '.opentofu.repository' "$lock")
          tofu_tag=$(jq -r '.opentofu.tag' "$lock")
          verify_release "$tofu_repo" "$tofu_tag" "$(jq -r '.opentofu.release_id' "$lock")" "$(jq -r '.opentofu.target_commit_sha' "$lock")" false "$WORK_DIR/tofu-release.json"
          download_asset "$tofu_repo" "$WORK_DIR/tofu-release.json" "$(jq -r '.opentofu.asset.id' "$lock")" "$(jq -r '.opentofu.asset.name' "$lock")" "$(jq -r '.opentofu.asset.size' "$lock")" "$(jq -r '.opentofu.asset.sha256' "$lock")" "$WORK_DIR/tofu/tofu.zip"
          download_asset "$tofu_repo" "$WORK_DIR/tofu-release.json" "$(jq -r '.opentofu.checksums.id' "$lock")" "$(jq -r '.opentofu.checksums.name' "$lock")" "$(jq -r '.opentofu.checksums.size' "$lock")" "$(jq -r '.opentofu.checksums.sha256' "$lock")" "$WORK_DIR/tofu/SHA256SUMS"
          tofu_asset_name=$(jq -r '.opentofu.asset.name' "$lock")
          cp "$WORK_DIR/tofu/tofu.zip" "$WORK_DIR/tofu/$tofu_asset_name"
          (cd "$WORK_DIR/tofu" && awk -v name="$tofu_asset_name" '$2==name {print}' SHA256SUMS | sha256sum -c -)
          unzip -q "$WORK_DIR/tofu/tofu.zip" -d "$WORK_DIR/tofu/bin"
          tofu=$(find "$WORK_DIR/tofu/bin" -type f -name tofu -print -quit)
          test -n "$tofu"
          chmod +x "$tofu"
          test "$(sha256sum "$tofu" | awk '{print $1}')" = "$(jq -r '.opentofu.binary_sha256' "$lock")"
          printf '%s\n' "$tofu" > "$WORK_DIR/tofu-path"

          spec_url=$(jq -r '.opentofu.json_spec.url' "$lock")
          curl --fail --location --silent --show-error "$spec_url" -o "$WORK_DIR/opentofu-json-spec.mdx"
          test "$(sha256sum "$WORK_DIR/opentofu-json-spec.mdx" | awk '{print $1}')" = "$(jq -r '.opentofu.json_spec.sha256' "$lock")"
          go version > "$WORK_DIR/go-version.txt"
          grep -Eq '^go version go1\.27([.]| )' "$WORK_DIR/go-version.txt"

      - name: Bind the released semantic graph
        shell: bash
        run: |
          set -euo pipefail
          gooo=$(cat "$WORK_DIR/gooo-path")
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$WORK_DIR/compile-rss-kib" "$gooo" graph dump examples/intent/main.gooo > "$WORK_DIR/released-semantic-graph.json"
          end_ns=$(date +%s%N)
          echo $(( (end_ns-start_ns+999999)/1000000 )) > "$WORK_DIR/compile-wall-ms"
          python3 scripts/project_envelope.py bind --source examples/intent/main.gooo --graph "$WORK_DIR/released-semantic-graph.json" --denominator contracts/project-envelope-v2.json --output "$WORK_DIR/bindings.json"
          jq -e '.state=="CLOSED" and .activity_count==12 and .binding_edges==14 and .semantic_authority.scope=="GENERATED_OPENTOFU_SERVICE_PROJECT_ONLY"' "$WORK_DIR/bindings.json" >/dev/null

      - name: Inventory the submitted repository
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/project_envelope.py inventory --root . --output "$WORK_DIR/inventory.json"
          jq -e '.root_readme_excluded==true and .go_physical_files==0 and .gooo_physical_files==1' "$WORK_DIR/inventory.json" >/dev/null

      - name: Generate the OpenTofu project and service evidence
        shell: bash
        run: |
          set -euo pipefail
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$WORK_DIR/build-rss-kib" python3 scripts/project_envelope.py generate --source examples/intent/main.gooo --graph "$WORK_DIR/released-semantic-graph.json" --lock contracts/release-lock-v1.json --spec "$WORK_DIR/opentofu-json-spec.mdx" --bindings "$WORK_DIR/bindings.json" --denominator contracts/project-envelope-v2.json --inventory "$WORK_DIR/inventory.json" --output-dir "$PUBLISH_DIR"
          end_ns=$(date +%s%N)
          echo $(( (end_ns-start_ns+999999)/1000000 )) > "$WORK_DIR/build-wall-ms"
          for file in main.tf.json service-contract.json relation-report.md dossier.md; do test -f "$PUBLISH_DIR/$file"; done

      - name: Validate generated JSON with pinned OpenTofu
        shell: bash
        run: |
          set -euo pipefail
          tofu=$(cat "$WORK_DIR/tofu-path")
          mkdir -p "$WORK_DIR/opentofu-project"
          cp "$PUBLISH_DIR/main.tf.json" "$WORK_DIR/opentofu-project/main.tf.json"
          "$tofu" version -json > "$WORK_DIR/tofu-version.json"
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$WORK_DIR/tofu-validate-rss-kib" bash -c 'cd "$1" && "$2" validate -json -no-color' bash "$WORK_DIR/opentofu-project" "$tofu" > "$WORK_DIR/tofu-validate.json"
          end_ns=$(date +%s%N)
          echo $(( (end_ns-start_ns+999999)/1000000 )) > "$WORK_DIR/tofu-validate-wall-ms"
          jq -e '.valid==true and (.error_count // 0)==0 and (.warning_count // 0)==0 and ((.diagnostics // [])|length)==0' "$WORK_DIR/tofu-validate.json" >/dev/null
          python3 scripts/project_envelope.py validate --tofu-json "$WORK_DIR/tofu-validate.json" --artifact "$PUBLISH_DIR/main.tf.json" --service-contract "$PUBLISH_DIR/service-contract.json" --output "$WORK_DIR/validation.json"
          jq -e '.state=="CLOSED" and .structural_checks.resource_count==3 and .structural_checks.module_count==0 and .structural_checks.providerless==true' "$WORK_DIR/validation.json" >/dev/null

      - name: Close the project receipt and test cases
        shell: bash
        run: |
          set -euo pipefail
          tofu=$(cat "$WORK_DIR/tofu-path")
          python3 scripts/project_envelope.py receipt --source examples/intent/main.gooo --graph "$WORK_DIR/released-semantic-graph.json" --artifact "$PUBLISH_DIR/main.tf.json" --service-contract "$PUBLISH_DIR/service-contract.json" --relation-report "$PUBLISH_DIR/relation-report.md" --validation "$WORK_DIR/validation.json" --tofu-json "$WORK_DIR/tofu-validate.json" --version-json "$WORK_DIR/tofu-version.json" --binary "$tofu" --lock contracts/release-lock-v1.json --output "$PUBLISH_DIR/contract-receipt.json"
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$WORK_DIR/test-rss-kib" python3 scripts/project_envelope.py cases --source examples/intent/main.gooo --bindings "$WORK_DIR/bindings.json" --output "$WORK_DIR/cases.json"
          end_ns=$(date +%s%N)
          echo $(( (end_ns-start_ns+999999)/1000000 )) > "$WORK_DIR/test-wall-ms"
          jq -e '.state=="CLOSED" and .case_count==6 and .outcome_counts=={"BOUND":2,"UNBOUND_UNKNOWN":2,"REFUTED":2}' "$WORK_DIR/cases.json" >/dev/null
          jq -e '[.cases[]|select(.status=="UNBOUND_UNKNOWN")|.claim|keys|sort] | all(.==["blocked_by","next_operation","reason","stage","step","unknown_class"])' "$WORK_DIR/cases.json" >/dev/null
          jq -e '.state=="CLOSED"' "$PUBLISH_DIR/contract-receipt.json" >/dev/null

      - name: Verify byte-identical deterministic replay
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/project_envelope.py replay --source examples/intent/main.gooo --graph "$WORK_DIR/released-semantic-graph.json" --lock contracts/release-lock-v1.json --spec "$WORK_DIR/opentofu-json-spec.mdx" --bindings "$WORK_DIR/bindings.json" --denominator contracts/project-envelope-v2.json --inventory "$WORK_DIR/inventory.json" --publish-dir "$PUBLISH_DIR" --output "$WORK_DIR/replay.json"
          jq -e '.state=="CLOSED" and .comparison_count==4 and (.comparisons|all(.[];.byte_equal==true))' "$WORK_DIR/replay.json" >/dev/null

      - name: Recompute semantic graph and relation evidence independently
        shell: bash
        run: |
          set -euo pipefail
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$WORK_DIR/conformance-rss-kib" python3 scripts/project_consumer.py --source examples/intent/main.gooo --graph "$WORK_DIR/released-semantic-graph.json" --main-tf-json "$PUBLISH_DIR/main.tf.json" --service-contract "$PUBLISH_DIR/service-contract.json" --relation-report "$PUBLISH_DIR/relation-report.md" --validation "$WORK_DIR/validation.json" --tofu-json "$WORK_DIR/tofu-validate.json" --output "$WORK_DIR/consumer-verification.json"
          end_ns=$(date +%s%N)
          echo $(( (end_ns-start_ns+999999)/1000000 )) > "$WORK_DIR/conformance-wall-ms"
          jq -e '.state=="CLOSED" and .authority.semantic_scope=="GENERATED_OPENTOFU_SERVICE_PROJECT_ONLY" and .relation_counts=={"bound":2,"refuted":2,"unbound_unknown":2} and .digest_chain.order==["SOURCE","SEMANTIC_GRAPH","GENERATED_FILES","PINNED_OPENTOFU_VALIDATE_JSON","RELATION_EVIDENCE"]' "$WORK_DIR/consumer-verification.json" >/dev/null

      - name: Record exact project observation
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg wall "$(cat "$WORK_DIR/compile-wall-ms")" --arg rss "$(cat "$WORK_DIR/compile-rss-kib")" '{wall_ms:($wall|tonumber),peak_rss_kib:($rss|tonumber),count:12,execution_state:"EXECUTED",cache_state:"DISABLED",runner_persistence:"EPHEMERAL",prior_test_evidence_reuse_state:"NOT_REUSED"}' > "$WORK_DIR/compile-measurement.json"
          jq -n --arg wall "$(cat "$WORK_DIR/build-wall-ms")" --arg rss "$(cat "$WORK_DIR/build-rss-kib")" '{wall_ms:($wall|tonumber),peak_rss_kib:($rss|tonumber),count:4,execution_state:"EXECUTED",cache_state:"DISABLED",runner_persistence:"EPHEMERAL",prior_test_evidence_reuse_state:"NOT_REUSED"}' > "$WORK_DIR/build-measurement.json"
          jq -n --arg wall "$(cat "$WORK_DIR/test-wall-ms")" --arg rss "$(cat "$WORK_DIR/test-rss-kib")" '{wall_ms:($wall|tonumber),peak_rss_kib:($rss|tonumber),count:6,execution_state:"EXECUTED",cache_state:"DISABLED",runner_persistence:"EPHEMERAL",prior_test_evidence_reuse_state:"NOT_REUSED",passed_test_count:2,failed_test_count:2,unknown_test_count:2}' > "$WORK_DIR/test-measurement.json"
          jq -n --arg wall "$(cat "$WORK_DIR/conformance-wall-ms")" --arg rss "$(cat "$WORK_DIR/conformance-rss-kib")" '{wall_ms:($wall|tonumber),peak_rss_kib:($rss|tonumber),count:6,execution_state:"EXECUTED",cache_state:"DISABLED",runner_persistence:"EPHEMERAL",prior_test_evidence_reuse_state:"NOT_REUSED"}' > "$WORK_DIR/conformance-measurement.json"
          jq -n --arg wall "$(cat "$WORK_DIR/tofu-validate-wall-ms")" --arg rss "$(cat "$WORK_DIR/tofu-validate-rss-kib")" '{wall_ms:($wall|tonumber),peak_rss_kib:($rss|tonumber),count:1,execution_state:"EXECUTED",cache_state:"DISABLED",runner_persistence:"EPHEMERAL",prior_test_evidence_reuse_state:"NOT_REUSED"}' > "$WORK_DIR/tofu-validate-measurement.json"
          jq -n --slurpfile compile "$WORK_DIR/compile-measurement.json" --slurpfile build "$WORK_DIR/build-measurement.json" --slurpfile test "$WORK_DIR/test-measurement.json" --slurpfile conformance "$WORK_DIR/conformance-measurement.json" --slurpfile tofu "$WORK_DIR/tofu-validate-measurement.json" '{compile:$compile[0],build:$build[0],test:$test[0],conformance:$conformance[0],tofu_validate:$tofu[0]}' > "$WORK_DIR/measurements.json"
          git status --porcelain=v1 > "$WORK_DIR/repository-status.txt"
          python3 scripts/project_envelope.py record --publish-dir "$PUBLISH_DIR" --source examples/intent/main.gooo --graph "$WORK_DIR/released-semantic-graph.json" --lock contracts/release-lock-v1.json --denominator contracts/project-envelope-v2.json --inventory "$WORK_DIR/inventory.json" --validation "$WORK_DIR/validation.json" --receipt "$PUBLISH_DIR/contract-receipt.json" --consumer "$WORK_DIR/consumer-verification.json" --cases "$WORK_DIR/cases.json" --replay "$WORK_DIR/replay.json" --measurements "$WORK_DIR/measurements.json" --go-version "$WORK_DIR/go-version.txt" --repository-status "$WORK_DIR/repository-status.txt" --output "$EVIDENCE_DIR/observation.json"
          jq -e '.state=="CLOSED" and .project.resources==2 and .project.service_capabilities==1 and .project.service_endpoints==2 and .project.opentofu_resources==3 and .project.opentofu_modules==0 and .authority.handwritten_go_physical_files==0 and .test_counts=={executed:6,failed:2,passed:2,reused:0,total:6,unknown:2}' "$EVIDENCE_DIR/observation.json" >/dev/null

      - name: Package caller-owned evidence
        shell: bash
        run: |
          set -euo pipefail
          cp "$PUBLISH_DIR/main.tf.json" "$EVIDENCE_DIR/main.tf.json"
          cp "$PUBLISH_DIR/service-contract.json" "$EVIDENCE_DIR/service-contract.json"
          cp "$PUBLISH_DIR/relation-report.md" "$EVIDENCE_DIR/relation-report.md"
          cp "$PUBLISH_DIR/dossier.md" "$EVIDENCE_DIR/dossier.md"
          cp "$PUBLISH_DIR/contract-receipt.json" "$EVIDENCE_DIR/contract-receipt.json"
          cp "$WORK_DIR/released-semantic-graph.json" "$EVIDENCE_DIR/released-semantic-graph.json"
          cp "$WORK_DIR/bindings.json" "$EVIDENCE_DIR/bindings.json"
          cp "$WORK_DIR/inventory.json" "$EVIDENCE_DIR/inventory.json"
          cp "$WORK_DIR/validation.json" "$EVIDENCE_DIR/validation.json"
          cp "$WORK_DIR/tofu-validate.json" "$EVIDENCE_DIR/tofu-validate.json"
          cp "$WORK_DIR/tofu-version.json" "$EVIDENCE_DIR/tofu-version.json"
          cp "$WORK_DIR/go-version.txt" "$EVIDENCE_DIR/go-version.txt"
          cp "$WORK_DIR/consumer-verification.json" "$EVIDENCE_DIR/consumer-verification.json"
          cp "$WORK_DIR/cases.json" "$EVIDENCE_DIR/cases.json"
          cp "$WORK_DIR/replay.json" "$EVIDENCE_DIR/replay.json"
          cp contracts/project-envelope-v2.json "$EVIDENCE_DIR/project-envelope-v2.json"
          artifact_name="gooo-generated-service-project-evidence-${GITHUB_SHA}"
          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

      - name: Upload generated service-project evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Summarize project observation
        shell: bash
        run: |
          set -euo pipefail
          jq '{project,authority,generated_outputs,relation_evidence,test_counts,metrics}' "$EVIDENCE_DIR/observation.json"
